<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>AI Overnight</title>
<meta name="description" content="A free, friendly crash course on how modern AI works. Short lessons, quizzes with trick questions, and a tutor prompt for your own AI.">
<meta name="theme-color" content="#F5F5F7">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap">
<style>
:root{
  --blue:#0A84FF; --blue-soft:#E5F1FF; --orange:#D46B00; --orange-fill:#FF9500; --orange-tint:#FFF6EC; --orange-line:#FFD8A8;
  --green:#34C759; --green-ink:#248A3D; --green-tint:#E9FBEE; --red:#FF453A; --red-ink:#D70015; --red-tint:#FFECEB;
  --bg:#F5F5F7; --card:#FFFFFF; --ink:#1D1D1F; --ink2:#3A3A3C; --sub:#6E6E73; --faint:#8E8E93; --line:#E5E5EA; --line2:#F2F2F7;
  --shadow:0 6px 20px rgba(0,0,0,.06);
  --spring:cubic-bezier(.34,1.56,.64,1);
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text",Inter,system-ui,sans-serif;font-size:16px;line-height:1.45;-webkit-font-smoothing:antialiased;overflow-x:clip}
a{color:inherit;text-decoration:none}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer;padding:0}
button:focus-visible,a:focus-visible{outline:3px solid var(--blue);outline-offset:2px;border-radius:12px}
svg.i{display:inline-block;vertical-align:middle;flex:0 0 auto}
.app{display:flex;min-height:100vh}
.side{display:none}
.main{flex:1;min-width:0;max-width:560px;margin:0 auto;padding:max(20px,env(safe-area-inset-top)) 20px 120px;display:flex;flex-direction:column;gap:18px}
.tabbar{position:fixed;left:0;right:0;bottom:0;background:rgba(255,255,255,.82);backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);border-top:1px solid var(--line);display:flex;justify-content:space-around;padding:10px 0 max(14px,env(safe-area-inset-bottom));z-index:20}
.tab{display:flex;flex-direction:column;align-items:center;gap:3px;font-size:11px;font-weight:600;color:var(--faint);min-width:72px}
.tab.on{color:var(--blue)}
.tab .i{color:var(--blue);opacity:.45}.tab.on .i{opacity:1}
.card{background:var(--card);border-radius:24px;padding:20px;box-shadow:var(--shadow)}
.you{border-left:5px solid var(--blue)}
.eyebrow{font-size:12px;font-weight:700;letter-spacing:.06em}
.h1{font-size:30px;font-weight:700;letter-spacing:-.02em;line-height:1.1;margin:0}
.h2{font-size:20px;font-weight:700;letter-spacing:-.01em;margin:0}
.muted{color:var(--sub)}
.btn{display:flex;align-items:center;justify-content:center;gap:8px;background:var(--blue);color:#fff;font-weight:600;font-size:17px;padding:14px 20px;border-radius:999px;transition:transform .15s var(--spring),box-shadow .2s}
.btn:active{transform:scale(.96)}
.btn.small{font-size:14px;padding:9px 14px}
.link{color:var(--blue);font-weight:600;display:inline-flex;align-items:center;gap:6px}
.track{height:8px;border-radius:999px;background:var(--blue-soft);overflow:hidden}
.track>i{display:block;height:100%;background:var(--blue);border-radius:999px;transition:width 1s var(--spring)}
.steps{display:flex;gap:4px}.steps>span{flex:1;height:5px;border-radius:3px;background:#E3E3E8;overflow:hidden}.steps>span>i{display:block;height:100%;background:var(--blue);border-radius:3px;animation:grow .8s ease-out both}
.diagram{border-radius:24px;padding:16px 18px 18px;background:var(--orange-tint);border:1.5px solid var(--orange-line);display:flex;flex-direction:column;gap:14px}
.dtag{display:flex;align-items:center;gap:6px;font-size:11px;font-weight:700;letter-spacing:.06em;color:var(--orange)}
.tok{font-weight:600;padding:5px 10px;border-radius:8px;background:#fff;border:1.5px solid var(--orange-line);display:inline-block;animation:pop .5s var(--spring) both}
.tok.q{border-style:dashed;border-color:#AEAEB2;color:#AEAEB2;animation:blink 1.2s ease-in-out infinite}
.bar{flex:1;height:10px;border-radius:5px;background:#fff;overflow:hidden}.bar>i{display:block;height:100%;border-radius:5px;background:var(--orange-fill);animation:grow 1s cubic-bezier(.22,1,.36,1) both}
.toki-says{display:flex;align-items:flex-start;gap:12px}
.bubble{background:var(--orange-tint);border:1.5px solid var(--orange-line);border-radius:4px 18px 18px 18px;padding:10px 14px;font-size:15px;color:var(--ink2)}
.bubble b{display:flex;align-items:center;gap:4px;font-size:12px;color:var(--orange)}
.term{padding:12px 0;border-bottom:1px solid var(--line2);display:flex;flex-direction:column;gap:2px}.term:last-child{border-bottom:0}
.term b{color:var(--orange)}
.row{display:flex;align-items:center;gap:12px;padding:13px 0;border-bottom:1px solid var(--line2)}.row:last-child{border-bottom:0}
.dot{width:28px;height:28px;border-radius:999px;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:13px;flex:0 0 28px;border:1.5px solid #D1D1D6;color:var(--sub);background:#fff}
.dot.done{background:var(--blue);border-color:var(--blue);color:#fff}.dot.now{border:2px solid var(--blue);color:var(--blue)}
.field{display:flex;gap:8px;align-items:center;background:var(--bg);border:1px solid #D1D1D6;border-radius:999px;padding:5px 5px 5px 16px}
.field input{flex:1;min-width:0;border:0;background:none;font:inherit;font-size:16px;outline:none}
.opt{display:flex;align-items:center;gap:12px;text-align:left;padding:14px 16px;min-height:60px;border-radius:18px;border:2px solid #D1D1D6;background:#fff;font-size:16px;font-weight:500;width:100%;transition:transform .15s var(--spring),border-color .2s,background .2s}
.opt:active{transform:scale(.98)}
.opt .k{flex:0 0 30px;height:30px;border-radius:9px;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:14px;background:rgba(10,132,255,.12);color:var(--blue)}
.opt.right{border-color:var(--green);background:var(--green-tint)}.opt.right .k{background:var(--green);color:#fff}
.opt.wrong{border-color:var(--red);background:var(--red-tint);animation:shake .4s}.opt.wrong .k{background:var(--red);color:#fff}
.opt.dim{border-color:var(--line)}.opt.dim .k{background:var(--line2);color:#AEAEB2}
.qsegs{flex:1;display:flex;gap:4px}.qsegs>span{flex:1;height:12px;border-radius:6px;background:#E3E3E8;overflow:hidden}.qsegs>span>i{display:block;height:100%;width:0;background:var(--blue);border-radius:6px;transition:width .5s var(--spring)}
.qsegs>span.snap{animation:squash .45s ease-out .15s}
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:30;padding:22px 20px max(28px,env(safe-area-inset-bottom));border-radius:32px 32px 0 0;display:flex;flex-direction:column;gap:14px;animation:sheet .45s cubic-bezier(.22,1.2,.36,1) both;box-shadow:0 -10px 30px rgba(0,0,0,.08)}
.sheet .in{max-width:560px;width:100%;margin:0 auto;display:flex;flex-direction:column;gap:14px}
.sheet.ok{background:var(--green-tint)}.sheet.no{background:var(--red-tint)}
.confetti{position:fixed;left:50%;bottom:220px;width:0;height:0;z-index:31;pointer-events:none}
.confetti i{position:absolute;border-radius:3px;animation:burst 1.1s cubic-bezier(.2,.8,.3,1) both}
.iconbtn{width:40px;height:40px;border-radius:999px;background:#fff;display:flex;align-items:center;justify-content:center;box-shadow:0 2px 8px rgba(0,0,0,.06);color:var(--blue)}
.pill{display:inline-flex;align-items:center;gap:4px;font-weight:600;font-size:14px;color:var(--blue)}
.bob{animation:bob 2.6s ease-in-out infinite}
.toast{position:fixed;left:50%;top:18px;transform:translateX(-50%);background:var(--ink);color:#fff;padding:10px 16px;border-radius:999px;font-size:14px;font-weight:600;z-index:50;animation:toast 2.2s ease both}
.cta{position:sticky;bottom:96px;z-index:5;padding-top:8px}
.loaders{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:18px}
.ltag{align-self:flex-start;font-size:11px;font-weight:700;letter-spacing:.06em;padding:3px 9px;border-radius:999px}
@keyframes grow{from{width:0}}
@keyframes pop{0%{opacity:0;transform:scale(.5) translateY(10px)}70%{opacity:1;transform:scale(1.08)}100%{opacity:1;transform:scale(1)}}
@keyframes blink{0%,100%{opacity:.25}50%{opacity:1}}
@keyframes bob{0%,100%{transform:translateY(0) rotate(0)}50%{transform:translateY(-5px) rotate(-3deg)}}
@keyframes shake{0%,100%{transform:translateX(0)}20%,60%{transform:translateX(-6px)}40%,80%{transform:translateX(6px)}}
@keyframes sheet{from{transform:translateY(100%)}to{transform:translateY(0)}}
@keyframes squash{0%,100%{transform:scale(1)}40%{transform:scale(1.1,1.4)}}
@keyframes popin{0%{transform:scale(.3);opacity:0}60%{transform:scale(1.12);opacity:1}100%{transform:scale(1)}}
@keyframes burst{0%{transform:translate(0,0) rotate(0);opacity:1}60%{opacity:1}100%{transform:translate(var(--dx),var(--dy)) rotate(var(--r));opacity:0}}
@keyframes toast{0%{opacity:0;transform:translate(-50%,-10px)}12%,85%{opacity:1;transform:translate(-50%,0)}100%{opacity:0}}
@keyframes ring{from{stroke-dashoffset:var(--from)}}
@keyframes lfill{0%{width:4%}18%,28%{width:28%}48%,58%{width:64%}78%,94%{width:100%}100%{width:4%}}
@keyframes shine{0%{left:-90px}45%,100%{left:110%}}
@keyframes hop{0%,100%{transform:translateY(0)}50%{transform:translateY(-7px)}}
@keyframes chip{0%{opacity:0;transform:scale(.4) translateY(14px)}10%{opacity:1;transform:scale(1.1) translateY(-2px)}16%{transform:scale(1)}82%{opacity:1;transform:scale(1)}92%,100%{opacity:0;transform:scale(.9)}}
@keyframes ldot{0%,60%,100%{transform:translateY(0);opacity:.4}30%{transform:translateY(-6px);opacity:1}}
@keyframes lring{0%{stroke-dashoffset:414.7}35%,90%{stroke-dashoffset:296.2}100%{stroke-dashoffset:414.7}}
@keyframes ltoki{0%,30%{transform:scale(.2);opacity:0}42%{transform:scale(1.12);opacity:1}50%,90%{transform:scale(1);opacity:1}100%{transform:scale(.2);opacity:0}}
@keyframes lseg{0%{width:0}10%,88%{width:100%}100%{width:0}}
@media (min-width:960px){
  .side{display:flex;flex-direction:column;gap:20px;flex:0 0 290px;padding:28px 20px;background:rgba(255,255,255,.75);border-right:1px solid var(--line);position:sticky;top:0;height:100vh;overflow:auto}
  .main{max-width:1040px;padding:32px 48px 140px}
  .tabbar{display:none}
  .h1{font-size:44px}
  .two{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:20px;align-items:start}
  .sheet{left:290px}
  .cta{bottom:24px;max-width:360px}
}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important}}
</style>
</head>

/* ---------- Sound (Web Audio, synthesized, no files) ---------- */
const Sound = (() => {
  let ctx = null, master = null;
  let on = true;
  try { on = localStorage.getItem('aio-sound') !== 'off'; } catch (e) {}
  function ensure() {
    if (!ctx) {
      const AC = window.AudioContext || window.webkitAudioContext;
      if (!AC) return null;
      ctx = new AC(); master = ctx.createGain(); master.gain.value = 0.5; master.connect(ctx.destination);
    }
    if (ctx.state === 'suspended') ctx.resume();
    return ctx;
  }
  function tone(freq, start, dur, { type = 'sine', vol = 0.25, glide = null, attack = 0.005 } = {}) {
    const c = ensure(); if (!c || !on) return;
    const t = c.currentTime + start;
    const o = c.createOscillator(), g = c.createGain();
    o.type = type; o.frequency.setValueAtTime(freq, t);
    if (glide) o.frequency.exponentialRampToValueAtTime(glide, t + dur);
    g.gain.setValueAtTime(0.0001, t);
    g.gain.exponentialRampToValueAtTime(vol, t + attack);
    g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    o.connect(g); g.connect(master); o.start(t); o.stop(t + dur + 0.02);
  }
  const fx = {
    tap: () => tone(880, 0, 0.06, { vol: 0.08, glide: 660 }),
    pop: (i = 0) => tone(520 + i * 70, 0, 0.12, { type: 'triangle', vol: 0.12, glide: 760 + i * 70 }),
    right: () => { tone(1046.5, 0, 0.18, { vol: 0.2 }); tone(1568, 0.09, 0.35, { vol: 0.18 }); tone(3136, 0.09, 0.25, { vol: 0.03 }); },
    wrong: () => { tone(330, 0, 0.18, { type: 'triangle', vol: 0.16, glide: 247 }); tone(247, 0.14, 0.26, { type: 'triangle', vol: 0.12, glide: 196 }); },
    streak: () => [523.25, 659.25, 783.99, 1046.5, 1318.5].forEach((f, i) => tone(f, i * 0.06, 0.22, { vol: 0.13 })),
    tick: () => tone(1400, 0, 0.03, { type: 'square', vol: 0.025 }),
    whoosh: () => tone(300, 0, 0.25, { type: 'sine', vol: 0.06, glide: 900, attack: 0.08 }),
    done: () => { [523.25, 659.25, 783.99].forEach((f, i) => tone(f, i * 0.09, 0.3, { vol: 0.14 })); [523.25, 659.25, 783.99, 1046.5].forEach(f => tone(f, 0.36, 0.9, { vol: 0.07 })); }
  };
  return {
    play(name, arg) { if (on) try { fx[name](arg); } catch (e) {} },
    get on() { return on; },
    toggle() { on = !on; try { localStorage.setItem('aio-sound', on ? 'on' : 'off'); } catch (e) {} if (on) { ensure(); fx.tap(); } return on; }
  };
})();

/* ---------- State (this browser only) ---------- */
const store = {
  get() { try { return JSON.parse(localStorage.getItem('aio-proto') || '{}'); } catch (e) { return {}; } },
  set(v) { try { localStorage.setItem('aio-proto', JSON.stringify(v)); } catch (e) {} }
};
function state() { const s = store.get(); return { done: s.done || 1, streak: s.streak || 0, best: s.best || 0 }; }

const LESSONS = ['The AI family tree', 'How LLMs work', 'The AI landscape', 'Prompting', 'Agents, RAG and MCP', 'AI as a business', 'Responsible AI'];
const TERMS = [
  ['Token', 'The chunk of text an LLM reads and writes. Often part of a word.'],
  ['Context window', 'How much one request can hold: instructions, chat so far, documents and the answer.'],
  ['Embedding', 'A list of numbers that captures meaning. Similar meaning, nearby numbers.'],
  ['Hallucination', 'A fluent, confident answer that is wrong.']
];
const QUIZ = [
  { q: 'What does an LLM actually predict, over and over?', opts: ['The whole answer at once', 'The next token', 'A fact looked up in a database'], a: 1,
    why: 'It predicts one next token, adds it, and predicts again.' },
  { q: 'Roughly, what is a token?', opts: ['Always exactly one word', 'A chunk of text, often part of a word', 'One full sentence'], a: 1,
    why: 'Tokens are chunks. Common words can be one token, rarer words get split.' },
  { q: "After training, a model's weights are frozen. You tell a chatbot your name. Where does your name live?", trick: true,
    opts: ['In its weights. It learns your name on the spot', 'It retrains overnight on your chat', 'In the context window, for this chat'], a: 2,
    why: 'Weights do not change while you chat. Your name sits in the context window.' },
  { q: 'Why do very long chats seem to forget early details?', opts: ['The model gets tired', 'The oldest parts get cut or summarized to fit the context window', 'The weights reset every hour'], a: 1,

    }).join('')}
  </section>
  <p style="font-size:12px;color:var(--faint);text-align:center;margin:8px 0 0">A preview of the AI Overnight redesign. Made by Nishita with Claude. Icons: Phosphor (MIT).</p>`;
}

function lesson() {
  const s = state();
  const probs = [['jumps', 62], ['runs', 11], ['sat', 4]];
  return `
  <div style="display:flex;align-items:center;gap:12px">
    <a href="#/" data-snd="tap" class="link" style="height:36px;padding:0 12px 0 8px;border-radius:999px;background:#fff;box-shadow:0 2px 8px rgba(0,0,0,.06)">${ic('caret-left', 'var(--blue)', 18)}Home</a>
    <div style="flex:1;display:flex;flex-direction:column;gap:6px">
      <span style="font-size:12px;font-weight:600;color:var(--blue)">You: lesson 2 of 7</span>
      <div class="steps">${[0, 1, 2, 3, 4, 5, 6].map(i => `<span><i style="width:${i < s.done ? 100 : (i === 1 ? 35 : 0)}%"></i></span>`).join('')}</div>
    </div>
  </div>
  <div class="two">
    <div style="display:flex;flex-direction:column;gap:8px">
      <span class="eyebrow" style="color:var(--orange);font-size:13px">LESSON 2 · HOW LLMS WORK</span>
      <h1 class="h1">One job: predict the next token</h1>
      <p style="margin:0;font-size:17px;color:var(--ink2)">Given the text so far, the model guesses the next small chunk, adds it, and guesses again. Everything else is built on that loop.</p>
      <div class="toki-says" style="margin-top:8px"><div class="bob">${toki('think', 48)}</div><span class="bubble"><b>${ic('chat-circle-dots', 'var(--orange)', 14)}Toki says</b>It doesn't look facts up. It picks a likely next token, one at a time.</span></div>
    </div>
    <div class="diagram" id="diag">
      <div style="display:flex;align-items:center;gap:8px"><span class="dtag">${ic('chart-bar', 'var(--orange)', 16)}DIAGRAM</span><span style="font-size:12px;color:var(--faint)">Illustrative numbers</span></div>
      <div style="display:flex;gap:6px;flex-wrap:wrap">${['The', 'quick', 'brown', 'fox'].map((t, i) => `<span class="tok" style="animation-delay:${0.1 + i * 0.15}s">${t}</span>`).join('')}<span class="tok q">?</span></div>
      <span style="font-size:13px;color:var(--sub)">The model's guesses for the next token</span>
      ${probs.map(([w, p], i) => `<div style="display:flex;align-items:center;gap:8px;font-size:14px"><span style="width:48px;font-weight:600">${w}</span><span class="bar"><i style="width:${p}%;animation-delay:${0.8 + i * 0.12}s"></i></span><span style="width:34px;text-align:right;color:var(--sub)">${p}%</span></div>`).join('')}
      <button class="link" data-replay style="font-size:14px;align-self:flex-start">${ic('arrow-counter-clockwise', 'var(--blue)', 16)}Replay</button>
    </div>
  </div>
  <div class="two">
    <section class="card" style="border-top:4px solid var(--orange);padding:6px 18px">
      <h2 class="h2" style="padding:14px 0 4px">Key terms</h2>
      ${TERMS.map(([t, d]) => `<div class="term"><b>${t}</b><span style="font-size:15px;color:var(--ink2)">${d}</span></div>`).join('')}
    </section>
    <div style="display:flex;flex-direction:column;gap:18px">
      <section class="diagram">
        <div style="display:flex;align-items:center;gap:8px"><span class="dtag">${ic('chart-bar', 'var(--orange)', 16)}DIAGRAM</span><span style="font-size:12px;color:var(--faint)">Not to scale</span></div>
        <h2 class="h2">Context window</h2>
        <div style="display:flex;gap:3px;border-radius:12px;overflow:hidden;font-size:12px;font-weight:600">
          <span style="flex:1.2;background:var(--orange);color:#fff;padding:11px 8px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis">Instructions</span>
          <span style="flex:2;background:#E8902E;color:#fff;padding:11px 8px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis">Chat so far</span>
          <span style="flex:3;background:var(--orange-line);padding:11px 8px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis">Documents</span>
          <span style="flex:1;background:#fff;border:1.5px dashed var(--orange);padding:9.5px 8px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis">Answer</span>
        </div>
        <span style="font-size:15px;color:var(--ink2)">When a chat outgrows the window, the oldest parts get cut or summarized. That is why long chats seem to forget.</span>
      </section>
      <section class="card" style="display:flex;flex-direction:column;gap:10px">
        <h2 class="h2" style="font-size:17px">Ask your own AI</h2>
        <span class="muted" style="font-size:14px">We copy a prompt with this lesson and your question. Paste it into ChatGPT, Claude or Gemini. Nothing is sent from this page.</span>
        <form class="field" data-ask><input name="q" placeholder="Type your question" aria-label="Your question"><button class="btn small" type="submit">${ic('copy', '#fff', 16)}Copy prompt</button></form>
      </section>
    </div>
  </div>
  <div class="cta"><a class="btn" href="#/quiz" data-snd="whoosh" style="box-shadow:0 10px 24px rgba(10,132,255,.3)">Take the quiz</a></div>`;
}

let Q = null;
function quizStart() { Q = { i: 0, picked: null, streak: 0, right: 0 }; }
function quiz() {
  if (!Q) quizStart();
  if (Q.i >= QUIZ.length) return quizDone();
  const item = QUIZ[Q.i], p = Q.picked;
  return `
  <div style="display:flex;align-items:center;gap:12px">
    <a href="#/lesson" class="iconbtn" aria-label="Close quiz" data-snd="tap" data-quiz-close>${ic('x', 'var(--blue)', 20)}</a>
    <div class="qsegs" id="qsegs">${QUIZ.map((_, i) => `<span><i style="width:${i < Q.i || (i === Q.i && p === item.a) ? 100 : 0}%"></i></span>`).join('')}</div>
    <span class="pill" id="streak">${ic('fire', 'var(--blue)', 18)}${Q.streak}</span>
  </div>
  <div style="display:flex;flex-direction:column;gap:8px">
    <span style="font-size:13px;font-weight:600;color:var(--sub)">Question ${Q.i + 1} of ${QUIZ.length}${item.trick ? ' · Trick question' : ''} · <span style="color:var(--orange)">Lesson 2</span></span>
    <h1 class="h1" style="font-size:24px;line-height:1.2">${item.q}</h1>
  </div>
  <div style="display:flex;flex-direction:column;gap:10px" role="group" aria-label="Answers">
    ${item.opts.map((o, i) => {
      let cls = '';
      if (p !== null) cls = i === item.a ? 'right' : (i === p ? 'wrong' : 'dim');
      return `<button class="opt ${cls}" data-pick="${i}" ${p !== null ? 'disabled' : ''}><span class="k">${'ABC'[i]}</span><span>${o}</span></button>`;
    }).join('')}
  </div>
  ${p === null ? '<span style="font-size:14px;color:var(--faint);text-align:center">Tap an answer</span>' : ''}`;
}
function sheetHTML() {
  const item = QUIZ[Q.i], ok = Q.picked === item.a;
  const head = ok ? (Q.streak >= 3 ? `Nailed it. ${Q.streak} in a row!` : 'Nice one!') : 'Not quite';
  return `<div class="sheet ${ok ? 'ok' : 'no'}" id="sheet"><div class="in">
    <div style="display:flex;align-items:center;gap:14px">
      <div style="animation:popin .6s var(--spring) .1s both;flex:0 0 64px">${toki(ok ? 'happy' : 'think', 64)}</div>
      <div style="display:flex;flex-direction:column;gap:2px">
        <span style="font-size:20px;font-weight:700;color:${ok ? 'var(--green-ink)' : 'var(--red-ink)'};display:flex;align-items:center;gap:6px">${ic(ok ? 'check-circle' : 'x-circle', ok ? 'var(--green-ink)' : 'var(--red-ink)', 22)}${head}</span>
        <span style="font-size:15px;color:var(--ink2)">${item.why}</span>
      </div>
    </div>
    <button class="btn" data-next>${Q.i + 1 < QUIZ.length ? 'Continue' : 'See results'}</button>
  </div></div>`;
}
function quizDone() {
  const n = QUIZ.length, r = Q.right, C = 414.7;
  return `
  <div style="display:flex;flex-direction:column;align-items:center;text-align:center;gap:16px;padding-top:30px">
    <div style="position:relative;width:180px;height:180px">
      <svg width="180" height="180" viewBox="0 0 150 150" aria-hidden="true"><circle cx="75" cy="75" r="66" fill="none" stroke="#E5F1FF" stroke-width="16"/><circle cx="75" cy="75" r="66" fill="none" stroke="#0A84FF" stroke-width="16" stroke-linecap="round" stroke-dasharray="${C} ${C}" stroke-dashoffset="${(C * (1 - r / n)).toFixed(1)}" transform="rotate(-90 75 75)" style="--from:${C};animation:ring 1.4s cubic-bezier(.22,1,.36,1) .2s both"/></svg>
      <div style="position:absolute;left:40px;top:38px;animation:popin .7s var(--spring) 1.2s both">${toki('happy', 100)}</div>
    </div>
    <span class="eyebrow" style="color:var(--blue)">YOUR RESULT</span>
    <h1 class="h1">${r} of ${n} right</h1>
    <p class="muted" style="margin:0;max-width:34ch">${r === n ? 'Perfect run. Lesson 2 is done.' : 'Lesson 2 is done. Try again any time to beat your score.'}</p>
    <div style="display:flex;gap:10px;flex-wrap:wrap;justify-content:center">
      <button class="btn" data-retry style="background:#fff;color:var(--blue);box-shadow:var(--shadow)">${ic('arrow-counter-clockwise', 'var(--blue)', 18)}Try again</button>
      <a class="btn" href="#/" data-snd="tap">Back home</a>
    </div>
  </div>`;
}

function loaders() {
  const card = (tag, tagColor, title, desc, body, snd) => `
    <section class="card" style="display:flex;flex-direction:column;gap:10px;border-radius:28px;min-height:320px">
      <span class="ltag" style="color:${tagColor};background:${tagColor}1F">${tag}</span>
      <h2 class="h2">${title}</h2>
      <span class="muted" style="font-size:15px">${desc}</span>
      <div style="flex:1;display:flex;flex-direction:column;justify-content:center;gap:12px;padding:8px 0">${body}</div>
      <button class="link" data-hear="${snd}" style="align-self:flex-start">${ic('speaker-high', 'var(--blue)', 18)}Hear it</button>
    </section>`;
  const pal = ['#0A84FF', '#FF9500', '#34C759', '#FF453A', '#64D2FF', '#FFC56B'];
  const conf = Array.from({ length: 14 }, (_, i) => { const a = (-165 + i * (150 / 13)) * Math.PI / 180, d = 70 + (i % 4) * 20; return `<i style="width:${i % 3 ? 6 : 8}px;height:${i % 3 ? 12 : 8}px;background:${pal[i % 6]};--dx:${Math.round(Math.cos(a) * d)}px;--dy:${Math.round(Math.sin(a) * d)}px;--r:${(i % 2 ? 1 : -1) * (200 + i * 25)}deg;opacity:0;animation:lburst 3.2s cubic-bezier(.2,.8,.3,1) infinite"></i>`; }).join('');
  return `
  <header style="display:flex;flex-direction:column;gap:6px">
    <h1 class="h1">Delight kit</h1>
    <p class="muted" style="margin:0">Four loading moments, playing on a loop. Tap "Hear it" for each sound.</p>
  </header>
  <style>@keyframes lburst{0%,44%{transform:translate(0,0);opacity:0}45%{opacity:1}62%{transform:translate(var(--dx),var(--dy)) rotate(calc(var(--r)*.6));opacity:1}80%,100%{transform:translate(calc(var(--dx)*1.1),calc(var(--dy) + 50px)) rotate(var(--r));opacity:0}}@keyframes lstreak{0%,44%{transform:scale(1)}50%{transform:scale(1.2)}58%,100%{transform:scale(1)}}</style>
  <div class="loaders">
  ${card('YOUR PROGRESS', '#0A84FF', 'Toki rides the bar', 'Fills in uneven bursts with short pauses, like real work.', `
    <div style="position:relative;height:22px;margin:56px 24px 0 0">
      <div style="position:absolute;inset:0;border-radius:11px;background:#EEEEF3;overflow:hidden"><div style="height:100%;border-radius:11px;background:linear-gradient(90deg,#64D2FF,#0A84FF);animation:lfill 4s cubic-bezier(.34,1.4,.64,1) infinite"></div><span style="position:absolute;top:0;width:70px;height:100%;background:linear-gradient(90deg,rgba(255,255,255,0),rgba(255,255,255,.6),rgba(255,255,255,0));animation:shine 2s linear infinite"></span></div>
      <div style="position:absolute;left:0;bottom:18px;height:54px;animation:lfill 4s cubic-bezier(.34,1.4,.64,1) infinite"><div style="position:absolute;right:-27px;bottom:0;animation:hop .7s ease-in-out infinite">${toki('calm', 54)}</div></div>
    </div><span style="font-weight:600;font-size:15px">Loading Lesson 2</span>`, 'ticks')}
  ${card('LESSON', '#D46B00', 'Thinking in tokens', 'While an answer loads, words arrive as token chips that pop in one by one.', `
    <div style="display:flex;flex-wrap:wrap;gap:8px">${['Pre', 'dict', 'ing', '·the', '·next', '·token'].map((t, i) => `<span class="tok" style="font-size:18px;padding:8px 12px;border-radius:12px;animation:chip 3.6s var(--spring) ${i * 0.28}s infinite both">${t}</span>`).join('')}</div>
    <div style="display:flex;gap:6px">${[0, 1, 2].map(i => `<span style="width:10px;height:10px;border-radius:999px;background:#AEAEB2;animation:ldot 1.2s ease-in-out ${i * 0.15}s infinite"></span>`).join('')}</div>`, 'pops')}
  ${card('YOUR PROGRESS', '#0A84FF', 'Close the ring', 'Finishing a lesson fills a ring, then Toki pops in with a smile.', `
    <div style="display:flex;align-items:center;gap:24px;flex-wrap:wrap">
      <div style="position:relative;width:150px;height:150px"><svg width="150" height="150" viewBox="0 0 150 150" aria-hidden="true"><circle cx="75" cy="75" r="66" fill="none" stroke="#E5F1FF" stroke-width="16"/><circle cx="75" cy="75" r="66" fill="none" stroke="#0A84FF" stroke-width="16" stroke-linecap="round" stroke-dasharray="414.7 414.7" stroke-dashoffset="296.2" transform="rotate(-90 75 75)" style="animation:lring 4s cubic-bezier(.22,1,.36,1) infinite"/></svg><div style="position:absolute;left:33px;top:31px;animation:ltoki 4s var(--spring) infinite">${toki('happy', 84)}</div></div>
      <div style="display:flex;flex-direction:column;gap:4px"><span style="font-size:36px;font-weight:700;letter-spacing:-.02em">2 of 7</span><span class="muted" style="font-size:15px">lessons done</span></div>
    </div>`, 'done')}
  ${card('YOUR PROGRESS', '#0A84FF', 'Streak burst', 'Each right answer snaps a segment in. Four in a row sets off confetti.', `
    <span class="pill" style="align-self:flex-start;background:rgba(10,132,255,.12);padding:6px 12px;border-radius:999px;animation:lstreak 3.2s ease-out infinite">${ic('fire', 'var(--blue)', 16)}4 in a row</span>
    <div style="position:relative;display:flex;gap:6px">${[0, 1, 2, 3, 4, 5, 6, 7].map(i => `<div style="flex:1;height:16px;border-radius:8px;background:#EEEEF3;overflow:hidden"><div style="height:16px;border-radius:8px;background:#0A84FF;width:0;${i < 4 ? `animation:lseg 3.2s var(--spring) ${i * 0.35}s infinite both` : ''}"></div></div>`).join('')}<div style="position:absolute;left:50%;top:4px;width:0;height:0">${conf}</div></div>`, 'streak')}
  </div>
  <section class="card" style="display:flex;flex-direction:column;gap:12px;background:var(--ink);color:#fff">
    <h2 class="h2">Sound principles</h2>
    <span style="color:#A1A1A6;font-size:15px">Every sound is generated in your browser, nothing is downloaded. They are short, soft and tuned to the same major chord so they never clash. Right answers rise, wrong answers fall gently, streaks climb an arpeggio. The sound switch is on Home and in the sidebar, and your choice is remembered.</span>
  </section>`;
}

/* ---------- Router ---------- */
const view = document.getElementById('view');
function route() { const h = location.hash.replace(/^#\/?/, ''); return ['lesson', 'quiz', 'loaders'].includes(h) ? h : 'home'; }
function render() {
  const r = route();
  document.getElementById('sheet')?.remove();
  if (r === 'quiz' && !Q) quizStart();
  view.innerHTML = r === 'home' ? home() : r === 'lesson' ? lesson() : r === 'quiz' ? quiz() : loaders();
  document.getElementById('side').innerHTML = side(r);
  document.getElementById('tabs').innerHTML = tabs(r);
  document.getElementById('tabs').style.display = r === 'quiz' ? 'none' : '';
  if (r === 'lesson') [0, 1, 2, 3].forEach(i => setTimeout(() => Sound.play('pop', i), 100 + i * 150));
  if (r === 'quiz' && Q.i >= QUIZ.length) { setTimeout(() => Sound.play('done'), 1200); }
  window.scrollTo(0, 0);
}
function toast(msg) { const t = document.createElement('div'); t.className = 'toast'; t.textContent = msg; document.body.appendChild(t); setTimeout(() => t.remove(), 2300); }
function confetti() {
  const box = document.createElement('div'); box.className = 'confetti';
  const pal = ['#0A84FF', '#FF9500', '#34C759', '#FF453A', '#64D2FF', '#FFC56B'];
  box.innerHTML = Array.from({ length: 16 }, (_, i) => { const a = (-165 + i * (150 / 15)) * Math.PI / 180, d = 120 + (i % 4) * 30; return `<i style="width:${i % 3 ? 7 : 9}px;height:${i % 3 ? 14 : 9}px;background:${pal[i % 6]};--dx:${Math.round(Math.cos(a) * d)}px;--dy:${Math.round(Math.sin(a) * d)}px;--r:${(i % 2 ? 1 : -1) * (200 + i * 25)}deg;animation-delay:.1s"></i>`; }).join('');
  document.body.appendChild(box); setTimeout(() => box.remove(), 1500);
}

document.addEventListener('click', (e) => {
  const el = e.target.closest('[data-snd],[data-sound-toggle],[data-pick],[data-next],[data-retry],[data-hear],[data-replay]');
  if (!el) return;
  if (el.dataset.snd) Sound.play(el.dataset.snd);
  if (el.hasAttribute('data-sound-toggle')) { const on = Sound.toggle(); render(); toast(on ? 'Sound on' : 'Sound off'); }
  if (el.dataset.pick !== undefined) {
    const i = +el.dataset.pick, item = QUIZ[Q.i];
    if (Q.picked !== null) return;
    Q.picked = i;
    const ok = i === item.a;
    if (ok) { Q.streak++; Q.right++; } else Q.streak = 0;
    const s = store.get(); s.best = Math.max(s.best || 0, Q.streak); store.set(s);
    view.innerHTML = quiz();
    if (ok) {
      Sound.play('right');
      document.querySelectorAll('#qsegs>span')[Q.i]?.classList.add('snap');
      if (Q.streak >= 3) { setTimeout(() => Sound.play('streak'), 250); confetti(); }
    } else Sound.play('wrong');
    document.body.insertAdjacentHTML('beforeend', sheetHTML());
  }
  if (el.hasAttribute('data-next')) {
    Sound.play('tap'); Q.i++; Q.picked = null; document.getElementById('sheet')?.remove();
    if (Q.i >= QUIZ.length) { const s = store.get(); s.done = Math.max(s.done || 1, 2); store.set(s); }
    render();
  }
  if (el.hasAttribute('data-retry')) { Sound.play('tap'); quizStart(); render(); }
  if (el.hasAttribute('data-replay')) {
    Sound.play('tap');
    const d = document.getElementById('diag');
    d.querySelectorAll('.tok,.bar>i').forEach(n => { n.style.animation = 'none'; void n.offsetWidth; n.style.animation = ''; });
    [0, 1, 2, 3].forEach(i => setTimeout(() => Sound.play('pop', i), 100 + i * 150));
  }
  if (el.dataset.hear) {
    const h = el.dataset.hear;
    if (h === 'ticks') [0, 1, 2, 3, 4, 5].forEach(i => setTimeout(() => Sound.play('tick'), i * 120));
    else if (h === 'pops') [0, 1, 2, 3, 4, 5].forEach(i => setTimeout(() => Sound.play('pop', i), i * 280));
    else Sound.play(h);
    if (!Sound.on) toast('Sound is off. Turn it on from Home or the sidebar.');
  }
});
document.addEventListener('submit', (e) => {
  if (!e.target.matches('[data-ask]')) return;
  e.preventDefault();
  const q = e.target.q.value.trim() || 'Explain this lesson to me simply, with one everyday example.';
  const prompt = `I'm learning how LLMs work (lesson: "How LLMs work"). Key ideas: an LLM predicts the next token, adds it, and repeats; a token is a chunk of text, often part of a word; the context window is how much one request can hold, including the answer; embeddings are lists of numbers that capture meaning; a hallucination is a fluent, confident answer that is wrong.\n\nMy question: ${q}\n\nPlease answer simply, with one everyday example, then ask me one short question to check I understood.`;
  const done = () => { Sound.play('right'); toast('Copied. Paste it into your AI.'); };
  if (navigator.clipboard?.writeText) navigator.clipboard.writeText(prompt).then(done, () => { prompt && window.prompt('Copy this prompt:', prompt); });
  else window.prompt('Copy this prompt:', prompt);
});
window.addEventListener('hashchange', () => { if (route() === 'quiz' && Q && Q.i >= QUIZ.length) quizStart(); render(); });
render();
</script>
</body>
</html>
